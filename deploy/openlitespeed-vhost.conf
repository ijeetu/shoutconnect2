# Merge these blocks into the existing Connect Agency virtual-host config.
# This is a fragment, not a replacement for its PHP, SSL, log or user config.
# Merge existing rewrite/context / blocks instead of creating duplicates.

rewrite {
  enable                  1
  autoLoadHtaccess        1
}

errorpage 404 {
  url                     /404.html
}

context / {
  type                    static
  location                $DOC_ROOT/
  allowBrowse             1
  extraHeaders            <<<CONNECT_SECURITY_HEADERS
set Strict-Transport-Security "max-age=31536000"
set X-Content-Type-Options "nosniff"
CONNECT_SECURITY_HEADERS
}

# One week is intentional: URLs can also be requested without a version.
context exp:(?i)^.*\.(css|js)$ {
  type                    static
  location                $DOC_ROOT/$0
  allowBrowse             1
  addMIMEType             text/css css, application/javascript js
  enableExpires           1
  expiresDefault          A604800
  expiresByType           text/css=A604800, application/javascript=A604800, application/x-javascript=A604800, text/javascript=A604800
  extraHeaders            <<<CONNECT_CODE_CACHE_HEADERS
unset Cache-Control
set Cache-Control "public, max-age=604800"
CONNECT_CODE_CACHE_HEADERS
}

context exp:(?i)^.*\.(avif|webp)$ {
  type                    static
  location                $DOC_ROOT/$0
  allowBrowse             1
  addMIMEType             image/avif avif, image/webp webp
  enableExpires           1
  expiresDefault          A2592000
  expiresByType           image/avif=A2592000, image/webp=A2592000
  extraHeaders            <<<CONNECT_IMAGE_CACHE_HEADERS
unset Cache-Control
set Cache-Control "public, max-age=2592000"
CONNECT_IMAGE_CACHE_HEADERS
}
